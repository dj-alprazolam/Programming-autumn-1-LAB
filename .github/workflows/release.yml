name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions

permissions: write-all

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-test-dev cmake g++
      
      - name: Configure CMake
        run: |
          rm -rf CMakeCache.txt CMakeFiles
          cmake . -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: cmake --build . --config Release
      
      - name: Run tests
        run: |
          echo "=== Running tests ==="
          ./helloworld_cli
          ctest --output-on-failure --verbose
      
      - name: Build package
        run: cmake --build . --target package

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          echo "$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_PATH
      
      - name: Install Boost via vcpkg
        run: vcpkg install boost-test:x64-windows
      
      - name: Configure CMake
        run: |
          cmake . -DPATCH_VERSION=${{ github.run_number }} -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows
      
      - name: Build
        run: cmake --build . --config Release
      
      - name: Run tests
        run: |
          echo "=== Running tests ==="
          .\Release\helloworld_cli.exe
          ctest -C Release --output-on-failure --verbose