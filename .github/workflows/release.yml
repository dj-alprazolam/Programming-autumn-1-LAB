name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions

permissions: write-all

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-test-dev cmake g++
      
      - name: Configure CMake
        run: |
          rm -rf CMakeCache.txt CMakeFiles
          cmake . -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: cmake --build . --config Release
      
      - name: Check version output
        run: |
          echo "=== Checking version output ==="
          ./helloworld_cli
      
      - name: Run tests
        run: ctest --output-on-failure
      
      - name: Build package
        run: cmake --build . --target package
      
      - name: List generated packages
        run: |
          ls -la *.deb || echo "No .deb files found"
          find . -name "*.deb" -exec ls -la {} \;
      
      - name: Upload artifact (Ubuntu)
        uses: actions/upload-artifact@v4
        with:
          name: helloworld-ubuntu
          path: |
            *.deb
            helloworld_cli

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Boost (Windows)
        run: |
          choco install boost-msvc-14.3 --version=1.84.0 -y
        continue-on-error: true
      
      - name: Alternative Boost install
        if: failure()
        run: |
          curl -L https://github.com/boostorg/boost/releases/download/boost-1.84.0/boost-1.84.0-msvc-14.3-x64.exe -o boost.exe
          ./boost.exe /S /D=C:\boost
      
      - name: Configure CMake (Windows)
        run: |
          Remove-Item -Recurse -Force CMakeCache.txt, CMakeFiles -ErrorAction SilentlyContinue
          cmake . -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT=C:\boost -DBoost_NO_SYSTEM_PATHS=ON
      
      - name: Build (Windows)
        run: cmake --build . --config Release
      
      - name: Check version output
        run: |
          echo "=== Checking version output ==="
          .\Release\helloworld_cli.exe
      
      - name: Run tests
        run: ctest -C Release --output-on-failure
      
      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: helloworld-windows
          path: |
            Release/helloworld_cli.exe
            Release/*.dll

  create-release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: List artifacts
        run: ls -la artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/helloworld-ubuntu/*.deb
            artifacts/helloworld-ubuntu/helloworld_cli
            artifacts/helloworld-windows/helloworld_cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}