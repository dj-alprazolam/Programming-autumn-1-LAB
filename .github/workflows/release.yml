name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions

permissions: write-all

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-test-dev cmake g++
      
      - name: Configure CMake
        run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: cmake --build .
      
      - name: Run tests
        run: cmake --build . --target test
      
      - name: Build package
        run: cmake --build . --target package
      
      - name: List generated packages
        run: ls -la *.deb || echo "No .deb files found"
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}-ubuntu
          name: Release ${{ github.run_number }} (Ubuntu)
          draft: false
          prerelease: false
          files: |
            helloworld-1.0.${{ github.run_number }}-Linux.deb
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}-ubuntu
          files: |
            helloworld-1.0.${{ github.run_number }}-Linux.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Boost
        run: choco install boost-msvc-14.3 -y
      
      - name: Configure CMake
        run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: cmake --build . --config Release
      
      - name: Run tests
        run: cmake --build . --target test --config Release
      
      - name: Create Release
        id: create_release_win
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}-windows
          name: Release ${{ github.run_number }} (Windows)
          draft: false
          prerelease: false
          files: |
            helloworld_cli.exe
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}-windows
          files: |
            helloworld_cli.exe